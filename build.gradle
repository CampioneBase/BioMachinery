buildscript {
    repositories {
        maven { url = 'https://maven.aliyun.com/repository/public/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

group = 'campionebase'
version = '0.0.1'

java {
    archivesBaseName = 'biomachinery'
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    // 活体机械附属模组：核心模组 ErosionEra 在同一工作区中一起加载
    runs {
        client {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'biomachinery'

            mods {
                biomachinery {
                    source sourceSets.main
                }
                erosionera {
                    source project(':erosionera:').sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'biomachinery'

            mods {
                biomachinery {
                    source sourceSets.main
                }
                erosionera {
                    source project(':erosionera:').sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            args '--mod', 'biomachinery', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                biomachinery {
                    source sourceSets.main
                }
                erosionera {
                    source project(':erosionera:').sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "biomachinery.refmap.json"
    config "biomachinery.mixins.json"
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public/' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.20'

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // 核心模组：复合构建替换为本地工程，运行时与编译期都需要
    implementation project(':erosionera:')
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "biomachinery",
                "Specification-Vendor"    : "CampioneBase",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "CampioneBase",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')
