buildscript {
    repositories {
        maven { url = 'https://maven.aliyun.com/repository/public/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

group = 'campionebase'
version = '0.0.1'

// 核心模组（ErosionEra）的依赖坐标与构建产物位置。
//   工作区模式：核心是同一次构建中的 :core 子工程
//   独立模式  ：核心仓库以 git 子模块形式位于同级目录，需先在其目录内执行 gradlew build
def coreVersion = '0.0.1'
def inWorkspace = rootProject.findProject(':core') != null
def coreJarDir = inWorkspace
        ? rootProject.project(':core').layout.buildDirectory.dir('libs').get().asFile
        : file('../core/build/libs')
def coreJarTask = inWorkspace ? ':core:reobfJar' : null

java {
    archivesBaseName = 'biomachinery'
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    // 活体机械附属模组：核心模组 ErosionEra 在同一环境中一起加载
    runs {
        client {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'biomachinery'

            mods {
                biomachinery {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'biomachinery'

            mods {
                biomachinery {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            args '--mod', 'biomachinery', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                biomachinery {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "biomachinery.refmap.json"
    config "biomachinery.mixins.json"
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public/' }
    mavenCentral()
    // 核心模组的构建产物以本地文件形式依赖（见 fg-5.x 文档的 Local Mod Dependencies）
    flatDir { dir coreJarDir }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.20'

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // 核心模组：以「已 reobf 的构建产物」依赖，并由 fg.deobf 转回开发映射。
    // 不要改成 implementation project(':core')：那样核心会以开发命名空间再次进入
    // 类路径，与 Forge 加载的 reobf 产物重名冲突（NoSuchMethodError: m_xxxxx_）。
    implementation fg.deobf("campionebase:erosionera:${coreVersion}")
}

// 编译附属模组前先把核心模组的 reobf 产物构建出来
tasks.named('compileJava') { dependsOn coreJarTask }
tasks.named('build') { dependsOn coreJarTask }

jar {
    manifest {
        attributes([
                "Specification-Title"     : "biomachinery",
                "Specification-Vendor"    : "CampioneBase",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "CampioneBase",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')
