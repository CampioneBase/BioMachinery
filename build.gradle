buildscript {
    repositories {
        maven { url = 'https://maven.aliyun.com/repository/public/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

group = 'campionebase'
version = '0.0.1'

// 核心模组（ErosionEra）的依赖来源。
//   工作区模式：核心是同一次构建中的 :core 子工程
//   独立模式  ：核心仓库位于同级目录，需先在其目录内执行 gradlew build
// 核心模组的本地 maven 仓库（工作区根目录下的 .m2/repository），
// 由核心工程的 `gradlew :core:publishToWorkspaceMaven` 产出。
def workspaceMaven = rootProject.file('.m2/repository')
def coreProject = rootProject.findProject(':core')
def standaloneCoreJar = file("../core/build/libs/erosionera-0.0.1.jar")

java {
    archivesBaseName = 'biomachinery'
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    // 活体机械附属模组：核心模组 ErosionEra 在同一环境中一起加载
    runs {
        client {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'biomachinery'

            mods {
                biomachinery {
                    source sourceSets.main
                }

            }
        }

        server {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'biomachinery'

            mods {
                biomachinery {
                    source sourceSets.main
                }

            }
        }

        data {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            args '--mod', 'biomachinery', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                biomachinery {
                    source sourceSets.main
                }

            }
        }
    }
}

mixin {
    add sourceSets.main, "biomachinery.refmap.json"
    config "biomachinery.mixins.json"
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public/' }
    mavenCentral()
    // 核心模组的本地发布仓库（工作区内可用时）
    if (workspaceMaven.exists()) {
        maven {
            url = workspaceMaven
            content { includeGroup 'campionebase' }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.20'

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // 核心模组：以「已 reobf 的构件」依赖，再由 fg.deobf 转回开发命名空间。
    // 这是 Forge 官方文档中 Mod Dependencies 的标准写法，也是开发环境里唯一可靠的接法：
    //   - 直接加载核心的开发类 / 把源码集挂进运行配置 -> 类出现两份，抛 NoSuchMethodError: m_xxxxx_
    //   - 直接加载核心的 reobf 产物          -> 注册阶段抛 NoSuchMethodError / NoSuchFieldError
    // 前置：先执行 `gradlew :core:publishToWorkspaceMaven` 产出本地构件。
    if (workspaceMaven.exists()) {
        implementation fg.deobf("campionebase:erosionera:0.0.1")
    } else {
        // 极端情况兜底：本地仓库缺失时退回直接使用核心的构建产物
        implementation fg.deobf(files(standaloneCoreJar))
    }
}


jar {
    manifest {
        attributes([
                "Specification-Title"     : "biomachinery",
                "Specification-Vendor"    : "CampioneBase",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "CampioneBase",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')
