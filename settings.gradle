// 侵蚀国度：活体机械（BioMachinery）附属模组
//
// 本仓库作为 ErosionEra-Workspace 的子模块使用：在工作区根执行
//   gradlew :biomachinery:build
//   gradlew :biomachinery:runClient
// 会连带构建核心模组，并在同一次运行中同时加载核心与附属模组。
//
// 单独克隆本仓库无法独立构建：核心模组是必需依赖，
// 需先把同级目录的 core 仓库（子模块）构建出 build/libs/erosionera-<version>.jar。

rootProject.name = 'biomachinery'
